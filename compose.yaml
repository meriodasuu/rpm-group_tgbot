name: rpm-rental-bot

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rental_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro", "bot-db:/var/lib/postgresql/data"]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d rental_bot"]
      interval: 5s
      timeout: 3s
      retries: 12
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks: [default, rpm_club_backend, rpm_rent_backend]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
volumes: { bot-db: {} }
networks:
  rpm_club_backend:
    external: true
    name: rpm-club_backend
  rpm_rent_backend:
    external: true
    name: rpm-rent_backend
